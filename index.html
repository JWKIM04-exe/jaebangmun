<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>재방문</title>
<meta name="theme-color" content="#2b59c3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="재방문">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:light dark;
  --bg:light-dark(#f4f6fb,#0c111d);--card:light-dark(#fff,#151c2c);--ink:light-dark(#111827,#e8ecf6);
  --sub:light-dark(#5f6b80,#9aa6bd);--line:light-dark(#dfe4ee,#26314a);--pri:#2b59c3;--priInk:light-dark(#2b59c3,#8fb0ff);
  --priBg:light-dark(#e6edfc,#1d2a4d);--red:light-dark(#c62828,#ff8a80)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-bottom:96px}
.wrap{max-width:720px;margin:0 auto;padding:16px max(4vw,14px)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 14px}
h1{margin:0;font-size:24px;font-weight:800}
.count{color:var(--sub);font-size:14px}
button,input,textarea{font:inherit;color:inherit}
.search{width:100%;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:14px;font-size:16px}
.list{display:grid;gap:12px}
/* 한 칸 = 한 집 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.top{display:flex;align-items:flex-start;gap:10px}
.addr{flex:1;font-weight:700;font-size:17px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.badge{flex:none;background:var(--pri);color:#fff;font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.date{color:var(--sub);font-size:13px;margin-top:2px}
.memo{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.memo:empty{display:none}
.photos{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.photos:empty{display:none}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;cursor:pointer;border:1px solid var(--line)}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px;font-weight:600}
.acts .plus{background:var(--priBg);color:var(--priInk);border-color:transparent;flex:1}
.acts .del{color:var(--red)}
.empty{text-align:center;color:var(--sub);padding:48px 16px;border:1px dashed var(--line);border-radius:16px}
.fab{position:fixed;right:max(18px,calc(50vw - 342px));bottom:calc(20px + env(safe-area-inset-bottom));height:56px;padding:0 22px;border-radius:999px;border:0;background:var(--pri);color:#fff;font-size:17px;font-weight:700;box-shadow:0 6px 18px rgba(43,89,195,.35);cursor:pointer}
.tool{display:flex;gap:8px;justify-content:center;margin-top:24px}
.tool button,.tool label{font-size:13px;color:var(--sub);background:none;border:0;text-decoration:underline;cursor:pointer;padding:8px}
/* 입력 창 */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
form{padding:18px}
form h2{margin:0 0 6px;font-size:19px}
.f{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
.in{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
textarea.in{min-height:96px;resize:vertical}
.step{display:flex;align-items:center;gap:8px}
.step button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:22px;cursor:pointer}
.step input{width:72px;text-align:center}
.step span{color:var(--sub)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.th{position:relative}
.th img{width:76px;height:76px;object-fit:cover;border-radius:10px;display:block}
.th button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#000c;color:#fff;font-size:14px;line-height:1;cursor:pointer}
.addp{width:76px;height:76px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--sub);font-size:13px;cursor:pointer;text-align:center}
.btns{display:flex;gap:8px;margin-top:18px}
.btns button{flex:1;height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:700;cursor:pointer}
.btns .save{background:var(--pri);color:#fff;border-color:transparent}
.view{background:#000;width:100vw;max-width:100vw;height:100vh;max-height:100vh;border-radius:0}
.view img{width:100%;height:100%;object-fit:contain}
/* 지도 */
.hr{display:flex;align-items:center;gap:10px}
.mapbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--priInk);display:grid;place-items:center;cursor:pointer}
.mapdlg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;flex-direction:column}
.mapdlg[open]{display:flex}
.mbar{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.mbar b{flex:1;font-size:17px}
.mbar button{height:42px;min-width:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:15px}
#mapBox{position:relative;flex:1}
#map{position:absolute;inset:0}
.miss{position:absolute;top:8px;left:8px;right:8px;z-index:4;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--sub)}
.miss:empty{display:none}
.mmsg{position:absolute;inset:0;z-index:6;overflow:auto;padding:20px max(5vw,18px);background:var(--card);display:none}
.mmsg.on{display:block}
.mmsg h3{margin:0 0 8px;font-size:18px}.mmsg p{color:var(--sub);margin:0 0 10px}
.mmsg ol{padding-left:20px;margin:0 0 14px}.mmsg li{margin:6px 0}
.mmsg code{background:var(--priBg);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}
.mmsg a{color:var(--priInk)}
.mmsg .err{color:var(--red);font-weight:600}
.mmsg .save{height:48px;width:100%;margin-top:10px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-weight:700;cursor:pointer}
.lst{list-style:none;padding:0}.lst li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.lst span{flex:1;font-weight:600}.lst a{white-space:nowrap;font-size:14px}
.pin{background:var(--pri);color:#fff;font:800 14px system-ui;min-width:32px;height:32px;padding:0 9px;border-radius:16px 16px 16px 3px;border:2px solid #fff;box-shadow:0 2px 6px #0005;cursor:pointer}
.sheet{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 8px 28px #0005;display:none;max-width:560px;margin:0 auto}
.sheet.on{display:block}
.sheet .memo{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sheet .acts a{flex:1;display:grid;place-items:center;height:40px;border-radius:10px;background:var(--pri);color:#fff;font-weight:700;font-size:14px;text-decoration:none}
.card.flash{animation:fl 1.6s}
@keyframes fl{0%,40%{box-shadow:0 0 0 3px var(--pri)}100%{box-shadow:0 0 0 0 transparent}}
@media(prefers-reduced-motion:reduce){.card.flash{animation:none;outline:3px solid var(--pri)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>재방문</h1>
    <div class="hr">
      <span class="count" id="count"></span>
      <button class="mapbtn" id="mapBtn" aria-label="재방문 구역 지도 보기" title="재방문 구역 지도">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6.2v13.8l6-2.2 6 2.2 6-2.2V4l-6 2.2L9 4z"/><path d="M9 4v13.8M15 6.2V20"/></svg>
      </button>
    </div>
  </header>
  <input class="search" id="q" type="search" placeholder="주소·메모 검색" aria-label="검색">
  <div class="list" id="list"></div>
  <div class="tool">
    <button id="exp">백업 저장</button>
    <label>백업 불러오기<input id="imp" type="file" accept=".json,application/json" class="sr"></label>
  </div>
</div>

<button class="fab" id="add">+ 새 재방문</button>

<dialog id="dlg">
  <form id="frm" method="dialog">
    <h2 id="ttl">새 재방문</h2>
    <label class="f" for="addr">주소</label>
    <input class="in" id="addr" required placeholder="예) 서울시 ○○구 ○○로 12, 301호" autocomplete="off">
    <label class="f" for="num">몇 번째 방문</label>
    <div class="step">
      <button type="button" id="minus" aria-label="빼기">−</button>
      <input class="in" id="num" type="number" min="1" value="1" inputmode="numeric">
      <button type="button" id="plus" aria-label="더하기">+</button>
      <span>번째</span>
    </div>
    <label class="f" for="first">첫 방문 날짜</label>
    <input class="in" id="first" type="date">
    <label class="f" for="date">이번 방문 날짜</label>
    <input class="in" id="date" type="date">
    <label class="f" for="memo">메모</label>
    <textarea class="in" id="memo" placeholder="대화 내용, 다음에 할 이야기 등"></textarea>
    <span class="f">사진</span>
    <div class="pick" id="pick">
      <label class="addp">＋<br>사진<input id="file" type="file" accept="image/*" multiple class="sr"></label>
    </div>
    <div class="btns">
      <button type="button" id="cancel">취소</button>
      <button type="submit" class="save">저장</button>
    </div>
  </form>
</dialog>

<dialog id="mapDlg" class="mapdlg">
  <div class="mbar">
    <button id="mapClose" aria-label="지도 닫기">←</button>
    <b>재방문 구역</b>
    <button id="mapKey">키 설정</button>
  </div>
  <div id="mapBox">
    <div id="map"></div>
    <div id="miss" class="miss"></div>
    <div id="mapMsg" class="mmsg"></div>
    <div id="sheet" class="sheet"></div>
  </div>
</dialog>

<dialog id="view" class="view"><img id="big" alt="사진 크게 보기"></dialog>

<script>
// ===== 저장소: 사진이 커서 localStorage 대신 IndexedDB 사용 =====
const DB='jaebangmun',ST='visits';
const db=new Promise((ok,no)=>{const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(ST,{keyPath:'id'});
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(mode,fn)=>{const d=await db;return new Promise((ok,no)=>{const t=d.transaction(ST,mode);const s=t.objectStore(ST);const r=fn(s);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})};
const all=()=>tx('readonly',s=>s.getAll());
const put=v=>tx('readwrite',s=>s.put(v));
const del=id=>tx('readwrite',s=>s.delete(id));

const $=id=>document.getElementById(id);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dates=v=>{const f=v.first||v.date||'';return f&&f!==v.date?`첫 방문 ${esc(f)} · 최근 ${esc(v.date||'')}`:`첫 방문 ${esc(f)}`};
let items=[],editing=null,photos=[];

// 사진 줄이기 (긴 쪽 1280px, JPEG) — 저장 공간 절약
function shrink(file){return new Promise(ok=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{const m=1280,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};
  img.onerror=()=>{URL.revokeObjectURL(u);ok(null)};img.src=u})}

// ===== 목록 =====
async function load(){items=(await all()).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.updated-a.updated);render()}
function render(){
  const q=$('q').value.trim().toLowerCase();
  const list=items.filter(v=>!q||(v.addr+' '+v.memo).toLowerCase().includes(q));
  $('count').textContent=items.length?`${items.length}곳`:'';
  if(!items.length){$('list').innerHTML='<div class="empty">아직 기록이 없어요.<br>아래 <b>+ 새 재방문</b>을 눌러 시작하세요.</div>';return}
  if(!list.length){$('list').innerHTML='<div class="empty">검색 결과가 없어요.</div>';return}
  $('list').innerHTML=list.map(v=>`
    <article class="card" data-id="${v.id}">
      <div class="top">
        <div class="addr">${esc(v.addr)}<div class="date">${dates(v)}</div></div>
        <span class="badge">${v.num}번째</span>
      </div>
      <p class="memo">${esc(v.memo||'')}</p>
      <div class="photos">${(v.photos||[]).map((p,i)=>`<img src="${p}" data-i="${i}" alt="사진 ${i+1}" loading="lazy">`).join('')}</div>
      <div class="acts">
        <button class="plus" data-a="again">+1 재방문</button>
        <button data-a="edit">수정</button>
        <button class="del" data-a="del">삭제</button>
      </div>
    </article>`).join('');
}
$('q').oninput=render;
$('list').onclick=async e=>{
  const card=e.target.closest('.card');if(!card)return;
  const v=items.find(x=>x.id===card.dataset.id);
  if(e.target.tagName==='IMG'){$('big').src=e.target.src;$('view').showModal();return}
  const a=e.target.dataset.a;
  if(a==='edit')openForm(v);
  if(a==='again')openForm(v,true);
  if(a==='del'&&confirm(`"${v.addr}" 기록을 삭제할까요?`)){await del(v.id);load()}
};
$('view').onclick=()=>$('view').close();

// ===== 재방문 구역 지도 (카카오맵) =====
const IN_ARTIFACT=false; // 미리보기(아티팩트)에서는 카카오 지도 스크립트가 막혀 있어 목록+링크로 대신 보여줌
const KEYK='jaebangmun-kakao-key';
const DEFAULT_KEY='a079dd1fe187cb3315d79dd78929d6f0'; // 카카오 JavaScript 키 (등록한 도메인에서만 작동)
const getKey=()=>{try{return localStorage.getItem(KEYK)||DEFAULT_KEY}catch{return DEFAULT_KEY}};
const setKey=k=>{try{localStorage.setItem(KEYK,k)}catch{}};
let kakaoP=null,map=null,overlays=[];
function loadKakao(key){
  if(kakaoP)return kakaoP;
  kakaoP=new Promise((ok,no)=>{const sc=document.createElement('script');
    sc.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&libraries=services&autoload=false`;
    sc.onload=()=>{try{kakao.maps.load(()=>ok(kakao))}catch(e){no(e)}};sc.onerror=no;document.head.appendChild(sc);
    setTimeout(()=>no(new Error('timeout')),10000)});
  kakaoP.catch(()=>{kakaoP=null});return kakaoP;
}
// 주소 → 좌표. "○○로 12, 301호"처럼 호수가 붙어 못 찾으면 호수를 떼고, 그래도 없으면 장소 검색
function geo(k,addr){return new Promise(ok=>{
  const S=k.maps.services.Status,g=new k.maps.services.Geocoder();
  const base=addr.split(',')[0].replace(/\s+\S*\d+\s*(호|층)$/,'').trim();
  const tries=[...new Set([addr,base])];
  const next=i=>{
    if(i<tries.length)return g.addressSearch(tries[i],(r,st)=>st===S.OK?ok({lat:+r[0].y,lng:+r[0].x}):next(i+1));
    new k.maps.services.Places().keywordSearch(base,(r,st)=>ok(st===S.OK?{lat:+r[0].y,lng:+r[0].x}:null));
  };next(0)})}
const mapMsg=h=>{$('mapMsg').innerHTML=h;$('mapMsg').classList.toggle('on',!!h)};
function showSetup(err){
  mapMsg(`<h3>카카오 지도 연결 (처음 한 번만)</h3>
    ${err?`<p class="err">${err}</p>`:'<p>지도를 띄우려면 내 카카오 JavaScript 키가 필요해요.</p>'}
    <ol>
      <li><a href="https://developers.kakao.com/console/app" target="_blank" rel="noopener">카카오 디벨로퍼스</a>에 로그인하고 <b>앱 만들기</b></li>
      <li><b>제품 설정 → 카카오맵 → 활성화</b>를 ON</li>
      <li><b>앱 → 플랫폼 키 → JavaScript 키 → JavaScript SDK 도메인</b>에 <code>${esc(location.origin)}</code> 추가</li>
      <li>JavaScript 키를 복사해서 아래에 붙여넣기</li>
    </ol>
    <label class="f" for="keyIn">JavaScript 키</label>
    <input class="in" id="keyIn" autocomplete="off" spellcheck="false" value="${esc(getKey())}">
    <button class="save" id="keySave">저장하고 지도 열기</button>`);
  $('keySave').onclick=()=>{const k=$('keyIn').value.trim();if(!k)return;const had=getKey();setKey(k);
    if(window.kakao&&had!==k){location.hash='map';location.reload()}else openMap()};
}
function showList(){
  mapMsg(`<h3>재방문 구역</h3>
    <p>이 미리보기 화면에서는 카카오 지도를 바로 띄울 수 없어요. GitHub에 올린 앱에서는 모든 재방문 집이 지도 한 장에 표시돼요. 여기서는 주소를 누르면 카카오맵에서 열려요.</p>
    ${items.length?`<ul class="lst">${items.map(v=>`<li><span>${esc(v.addr)}</span><b class="badge">${v.num}번째</b><a href="https://map.kakao.com/link/search/${encodeURIComponent(v.addr)}" target="_blank" rel="noopener">카카오맵 ↗</a></li>`).join('')}</ul>`:'<p>아직 기록이 없어요.</p>'}`);
}
function showSheet(v,g){
  $('sheet').innerHTML=`<div class="top"><div class="addr">${esc(v.addr)}<div class="date">${dates(v)}</div></div><span class="badge">${v.num}번째</span></div>
    <p class="memo">${esc(v.memo||'')}</p>
    <div class="acts"><a href="https://map.kakao.com/link/to/${encodeURIComponent(v.addr)},${g.lat},${g.lng}" target="_blank" rel="noopener">길찾기</a>
    <button data-s="card">카드 보기</button><button data-s="x" aria-label="닫기">✕</button></div>`;
  $('sheet').className='sheet on';
  $('sheet').onclick=e=>{const a=e.target.dataset.s;if(a==='x')$('sheet').className='sheet';
    if(a==='card'){$('mapDlg').close();$('q').value='';render();const c=document.querySelector(`.card[data-id="${v.id}"]`);
      if(c){c.scrollIntoView({behavior:'smooth',block:'center'});c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash')}}};
}
async function drawMap(k){
  if(!map)map=new k.maps.Map($('map'),{center:new k.maps.LatLng(37.5665,126.978),level:8});else map.relayout();
  overlays.forEach(o=>o.setMap(null));overlays=[];
  const b=new k.maps.LatLngBounds(),miss=[];let one=null;
  $('miss').textContent=items.length?'주소 위치를 찾는 중…':'아직 기록이 없어요. 재방문을 추가하면 여기에 표시돼요.';
  for(const v of items){
    let g=v.geo&&v.geo.a===v.addr?v.geo:null;
    if(!g){const r=await geo(k,v.addr);if(r){g={a:v.addr,...r};v.geo=g;put(v).catch(()=>{})}}
    if(!g){miss.push(v.addr);continue}
    const pos=new k.maps.LatLng(g.lat,g.lng);b.extend(pos);one=pos;
    const d=document.createElement('button');d.className='pin';d.textContent=v.num;d.setAttribute('aria-label',`${v.addr}, ${v.num}번째`);
    d.onclick=()=>showSheet(v,g);
    const o=new k.maps.CustomOverlay({position:pos,content:d,xAnchor:0,yAnchor:1});o.setMap(map);overlays.push(o);
  }
  if(overlays.length===1){map.setLevel(4);map.setCenter(one)}else if(overlays.length)map.setBounds(b);
  if(items.length)$('miss').textContent=miss.length?`위치를 못 찾은 주소 ${miss.length}곳: ${miss.join(' / ')}`:'';
}
async function openMap(){
  if(!$('mapDlg').open)$('mapDlg').showModal();
  $('sheet').className='sheet';$('miss').textContent='';
  if(IN_ARTIFACT)return showList();
  const key=getKey();if(!key)return showSetup();
  mapMsg('<p>지도를 불러오는 중…</p>');
  let k;try{k=await loadKakao(key)}catch{return showSetup('지도를 불러오지 못했어요. 키가 맞는지, 도메인을 등록했는지, 카카오맵을 활성화했는지 확인해 주세요.')}
  mapMsg('');requestAnimationFrame(()=>drawMap(k));
}
$('mapBtn').onclick=openMap;
$('mapClose').onclick=()=>$('mapDlg').close();
$('mapKey').onclick=()=>showSetup();
if(IN_ARTIFACT)$('mapKey').style.display='none';

// ===== 입력 창 =====
function openForm(v,again){
  editing=v||null;
  $('ttl').textContent=again?'재방문 기록':v?'수정':'새 재방문';
  $('addr').value=v?.addr||'';
  $('num').value=v?(again?v.num+1:v.num):1;
  $('date').value=again||!v?today():(v.date||today());
  $('first').value=v?(v.first||v.date||today()):today();
  $('memo').value=v?.memo||'';
  photos=[...(v?.photos||[])];
  drawPick();$('dlg').showModal();
}
function drawPick(){
  $('pick').querySelectorAll('.th').forEach(n=>n.remove());
  const add=$('pick').querySelector('.addp');
  photos.forEach((p,i)=>{const d=document.createElement('div');d.className='th';
    d.innerHTML=`<img src="${p}" alt="사진 ${i+1}"><button type="button" aria-label="사진 빼기">×</button>`;
    d.querySelector('button').onclick=()=>{photos.splice(i,1);drawPick()};
    $('pick').insertBefore(d,add)});
}
$('file').onchange=async e=>{for(const f of e.target.files){const p=await shrink(f);if(p)photos.push(p)}e.target.value='';drawPick()};
$('minus').onclick=()=>$('num').value=Math.max(1,(+$('num').value||1)-1);
$('plus').onclick=()=>$('num').value=(+$('num').value||0)+1;
$('add').onclick=()=>openForm();
$('cancel').onclick=()=>$('dlg').close();
$('frm').onsubmit=async e=>{
  e.preventDefault();
  const addr=$('addr').value.trim();if(!addr)return;
  const v={id:editing?.id||crypto.randomUUID(),addr,num:Math.max(1,+$('num').value||1),date:$('date').value||today(),first:$('first').value||$('date').value||today(),
    memo:$('memo').value.trim(),photos,geo:editing?.geo,updated:Date.now()};
  try{await put(v)}catch(err){alert('저장 공간이 부족해요. 사진 수를 줄여 보세요.');return}
  $('dlg').close();load();
};

// ===== 백업 (기기 바꿀 때) =====
$('exp').onclick=()=>{const b=new Blob([JSON.stringify({app:'jaebangmun',v:1,items})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`재방문-백업-${today()}.json`;a.click();URL.revokeObjectURL(a.href)};
$('imp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());const arr=Array.isArray(d)?d:d.items;
    if(!Array.isArray(arr))throw 0;
    if(!confirm(`${arr.length}개 기록을 불러올까요? (같은 기록은 덮어씀)`))return;
    for(const v of arr)if(v&&v.id&&v.addr)await put(v);load();
  }catch{alert('백업 파일을 읽지 못했어요.')}};

load().then(()=>{if(location.hash==='#map'){history.replaceState(null,'',location.pathname);openMap()}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
</script>
